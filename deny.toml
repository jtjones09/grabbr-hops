# cargo-deny configuration. CI and the release workflow run
# `cargo deny --all-features --workspace check advisories` with this file.
# An advisory against any crate in Cargo.lock fails the build, unless it is
# ignored below, or is an unmaintained one against a crate no hops crate
# depends on directly (`unmaintained` below). Unsound advisories fail wherever
# the crate sits in the tree (`unsound` below). The release notes list every
# advisory let through, and why.
#
# Only the advisories check is enabled. The licenses, bans and sources checks
# are not run, so they are not configured here.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates fail only when hops depends on them directly; the rest
# belong to the crates that use them, and the release notes name them.
unmaintained = "workspace"
# Unsound code is a memory-safety defect in what ships, whoever depends on it:
# cargo-deny's default ("workspace") let two through, in lru and
# event-listener, until they were updated.
unsound = "all"
yanked = "deny"
ignore = [
    # quick-xml 0.39 is reached only by wayland-scanner, a proc-macro that runs
    # at build time on Linux and parses the Wayland protocol files shipped in
    # its own crate. No input from a peer, a user or the network reaches it.
    # wayland-scanner 0.31 requires quick-xml 0.39; remove these two once a
    # release accepts 0.41.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml: build-time only, parses vendored Wayland protocol XML" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml: build-time only, parses vendored Wayland protocol XML" },
    # paste is a compile-time macro used at two call sites in hops-proto. It
    # generates code and has no runtime presence; being unmaintained is not a
    # defect in the code it emits.
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time macro only, no runtime code" },
    # rustybuzz is reached only through resvg/usvg, which Slint uses to draw
    # SVG images; it shapes text inside an SVG. ttf-parser is reached through
    # usvg too, where it reads the fonts that text is drawn in, and through
    # winit's sctk-adwaita (via ab_glyph), which on Linux Wayland reads a
    # system font to draw the title of a window hops decorates itself. The
    # hops GUI draws no SVG (its tray icon is a PNG compiled into the binary)
    # and loads no image or font from a peer, a file or the network, so no
    # outside input reaches either. Its own text is laid out by Slint without
    # them. Both entries also sit under `unmaintained = "workspace"`; they are
    # kept so the release notes give each its own reason.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: shapes text in SVG images only; the GUI draws no SVG and loads no image from a peer, a file or the network" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: reads fonts for SVG text and, on Linux Wayland, a system font for window titles; the GUI draws no SVG and loads no image or font from a peer, a file or the network" },
]
