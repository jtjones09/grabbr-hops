[package]
name = "hops-ipc"
description = "library for communication between lan-mouse service and frontends"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jtjones09/grabbr-hops"

[dependencies]
base64 = "0.22"
futures = "0.3.30"
getrandom = "0.3"
log = "0.4.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
sha2 = "0.10.8"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = ["macros", "net", "io-util", "time"] }
tokio-stream = { version = "0.1.15", features = ["io-util"] }

[target.'cfg(unix)'.dependencies]
# geteuid, to say whose lock file stops the daemon starting
libc = "0.2.148"

[dev-dependencies]
# the IPC auth tests drive a connection over an in-memory duplex
tokio = { version = "1.32.0", features = ["rt", "macros", "io-util", "time", "test-util"] }
futures = "0.3.30"
