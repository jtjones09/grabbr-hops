[package]
name = "input-event"
description = "cross-platform input-event types for input-capture / input-emulation"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jtjones09/grabbr-hops"

[dependencies]
futures-core = "0.3.30"
log = "0.4.22"
num_enum = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.0"

[target.'cfg(all(unix, not(target_os="macos")))'.dependencies]
reis = { version = "0.5.0", optional = true }

[features]
default = ["libei"]
# Keystroke logging. OFF by default and absent from every release feature set,
# so a shipped binary cannot record key content at all — the code is not in it.
# Enabling it is still not enough: HOPS_LOG_KEYS must name a duration. See #117.
keylog = []
libei = ["dep:reis"]
