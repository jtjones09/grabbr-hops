# Compile and test on every push and PR.
#
# Why this exists: `release.yml` builds ONLY `--no-default-features`, and there
# was no push/PR workflow at all — so nothing anywhere compiled the DEFAULT
# feature set. A new `FrontendEvent` variant made the then-default front-end's
# exhaustive match non-exhaustive and broke bare `cargo check` / `build` /
# `test` / `install --git` with E0004, while CI stayed green. It was caught only
# by review.
#
# The default feature set is therefore the point of this workflow, not an extra.
# (That front-end, hops-gtk, was retired on 2026-08-30; `tui` holds the slot now.
# The job below still exists to keep a bare `cargo build` honest.)
name: check

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Without this line every job gets the
# repository's default token permissions, which may include write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The configuration a contributor gets from a bare `cargo build`.
  # `libfontconfig1-dev` is named rather than assumed. Slint's software
  # renderer has pulled `yeslogic-fontconfig-sys` since the GUI scaffold
  # landed, and it built for months on whatever the runner image happened to
  # preinstall — until the image changed and `main` went red with no repo
  # change, the same way an unpinned toolchain did.
  default-features:
    name: default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev \
            libwayland-dev libx11-dev libxtst-dev pkg-config \
            libfontconfig1-dev
      - name: cargo check --locked --workspace --all-targets
        run: cargo check --locked --workspace --all-targets

  # The feature set the releases actually ship.
  release-features:
    name: release features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   features: "tui slint" }
          - { os: windows-latest, features: "tui slint" }
          # Linux's backends are features: "tui" alone has none, and no longer
          # compiles (src/lib.rs). tests/launcher_features.rs holds these
          # three to release.yml's.
          - { os: ubuntu-latest,  features: "tui libei_capture libei_emulation layer_shell_capture wlroots_emulation x11_capture x11_emulation rdp_emulation" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxtst-dev pkg-config libfontconfig1-dev
      - name: check
        run: cargo check --locked --no-default-features --features "${{ matrix.features }}" --all-targets
      - name: test
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}"
      # The guard in src/lib.rs, observed: a Linux build with no capture or
      # no emulation backend must fail to compile, and say why. x11 capture is a
      # stub, so it does not count as a capture backend.
      - name: a Linux build with no input backend does not compile
        if: runner.os == 'Linux'
        run: |
          for features in "tui" "tui libei_capture" "tui libei_emulation" "tui x11_capture x11_emulation"; do
            if out="$(cargo check --locked --no-default-features --features "$features" 2>&1)"; then
              echo "::error::--features \"$features\" compiled, with no input backend of one kind"
              exit 1
            fi
            grep -q "this build has no input" <<<"$out" || { echo "$out" | tail -20; exit 1; }
          done

  # The trust tests are the ones that must never silently stop running: each was
  # written to fail without its fix, and several guard a shipped vulnerability.
  #
  # Linux as well as macOS: with macOS alone, a Linux-only deadlock failed only
  # the Ubuntu release job, twice, while this job was green, and the tests of
  # every crate but the root one never ran on Linux at all. The runner is not
  # root, and tests of refusals that root would bypass rely on that. The IPC
  # crate's Linux-only tests (the sticky bit on the daemon's lock and socket,
  # a full accept queue) run here too. `the_workspace_tests_run_on_linux_and_on_macos`
  # in tests/release_pipeline.rs fails if either runner is dropped.
  workspace-tests:
    name: workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxtst-dev pkg-config libfontconfig1-dev
      # Was `-p hops-ipc -p hops-frontend-core`, which ran 121 of 166 tests. The
      # hops-slint guards — the sole evidence for four merged PRs — had never
      # executed in CI. A guard that does not run is a comment.
      - run: cargo test --locked --workspace --all-targets

  # The IPC crate's tests on Windows: the daemon's named pipe, who it admits,
  # the two-way proof over it, and the GUI's single-instance event. The
  # workspace tests above run on Linux and macOS only, and the release job
  # tests only the root crate, so the Windows transport was type-checked
  # and never run. `the_ipc_tests_run_on_windows` in
  # tests/release_pipeline.rs fails if this job is dropped or narrowed.
  ipc-tests-windows:
    name: IPC tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -p hops-ipc --all-targets

  # hops commits to NOT reading raw input devices on Linux. Capture is
  # portal-mediated (xdg-desktop-portal InputCapture / libei), which is
  # consent-gated and revocable; a raw device is neither.
  #
  # This exists because the installer used to tell every Linux user to add
  # themselves to the input group, granting system-wide keylogging, on a
  # machine running a KVM, for a capability no hops code ever used. A
  # commitment about what software does NOT do is worth nothing unless
  # something fails when it stops being true.
  #
  # It was two greps here: one over the installer, later a list of extensions
  # without `.rs`, and one over two of the crates. Each was scoped to where a
  # defect had been found, not to the property. The test reads every tracked
  # file outside a `tests` directory; the workspace tests run it as well.
  no-raw-input-devices:
    name: no /dev/input access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxtst-dev pkg-config libfontconfig1-dev
      - name: nothing shipped opens a raw input device or tells anyone to
        run: cargo test --locked --test no_raw_input_devices

  # A build script runs on the HOST. `cfg!(unix)` / `cfg!(target_os = ...)` inside
  # one therefore describes the build machine, not the target — which silently
  # disabled every Unix input backend on any cross-compile while still reporting
  # success (#44). The correct source is CARGO_CFG_TARGET_OS / _TARGET_FAMILY.
  #
  # `cfg!(feature = ...)` is fine and stays allowed: features ARE passed through.
  build-scripts-read-the-target:
    name: build scripts read the target, not the host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: no host platform predicates in build.rs
        run: |
          # strip comment lines first — the fixed scripts explain the trap in prose
          if grep -rnE '^[^/]*cfg!\((unix|windows|target_os|target_family|target_arch)' \
               --include='build.rs' . ; then
            echo "::error::A build script is reading a HOST cfg. Build scripts run on the"
            echo "host, so this describes the build machine, not the target — it silently"
            echo "mis-configures every cross-compile. Use CARGO_CFG_TARGET_OS /"
            echo "CARGO_CFG_TARGET_FAMILY instead. cfg!(feature = ...) is fine."
            exit 1
          fi
          echo "OK: build scripts derive platform from the target."

  # A published RustSec advisory against any crate in Cargo.lock fails CI.
  # deny.toml says which checks run and why each ignore is safe.
  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          command: check advisories
          arguments: --all-features --workspace

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check
