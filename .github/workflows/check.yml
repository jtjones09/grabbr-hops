# Compile and test on every push and PR.
#
# Why this exists: `release.yml` builds ONLY `--no-default-features`, and there
# was no push/PR workflow at all — so nothing anywhere compiled `gtk`, which is
# a DEFAULT feature and the primary Linux frontend. A new `FrontendEvent`
# variant made hops-gtk's exhaustive match non-exhaustive and broke bare
# `cargo check` / `build` / `test` / `install --git` with E0004, while CI stayed
# green. It was caught only by review.
#
# The default feature set is therefore the point of this workflow, not an extra.
name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The configuration a contributor gets from a bare `cargo build`, and the only
  # one that compiles hops-gtk.
  default-features:
    name: default features (incl. gtk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxtst-dev pkg-config
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

  # The feature set the releases actually ship.
  release-features:
    name: release features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   features: "tui slint" }
          - { os: windows-latest, features: "tui slint" }
          - { os: ubuntu-latest,  features: "tui" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxtst-dev pkg-config
      - name: check
        run: cargo check --no-default-features --features "${{ matrix.features }}" --all-targets
      - name: test
        run: cargo test --no-default-features --features "${{ matrix.features }}"

  # The trust tests are the ones that must never silently stop running: each was
  # written to fail without its fix, and several guard a shipped vulnerability.
  workspace-tests:
    name: workspace tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hops-ipc -p hops-frontend-core

  # hops commits to NOT reading raw input devices on Linux. Capture is
  # portal-mediated (xdg-desktop-portal InputCapture / libei), which is
  # consent-gated and revocable; /dev/input is neither.
  #
  # This exists because the installer used to tell every Linux user to run
  # `sudo usermod -aG input $USER` — granting system-wide keylogging, on a
  # machine running a KVM, for a capability no hops code ever used. A
  # commitment about what software does NOT do is worth nothing unless
  # something fails when it stops being true.
  no-raw-input-devices:
    name: no /dev/input access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the input path must stay portal-mediated
        run: |
          if grep -rnE '/dev/(input|uinput)|EVIOCGRAB|\bevdev::' \
               crates/input-capture/src crates/input-emulation/src src \
               --include='*.rs' ; then
            echo "::error::hops must not open raw input devices — see SECURITY-MODEL.md."
            echo "If this is a deliberate, privileged, opt-in backend, update this"
            echo "job and the security model in the same PR, not afterwards."
            exit 1
          fi
          echo "OK: no raw input-device access."
      - name: the installer must not tell users to grant one
        run: |
          if grep -nE 'usermod .*-aG .*input|gpasswd .*input' install.sh ; then
            echo "::error::install.sh must not instruct users into the input group."
            exit 1
          fi
          echo "OK: installer grants no input-group membership."

  # A build script runs on the HOST. `cfg!(unix)` / `cfg!(target_os = ...)` inside
  # one therefore describes the build machine, not the target — which silently
  # disabled every Unix input backend on any cross-compile while still reporting
  # success (#44). The correct source is CARGO_CFG_TARGET_OS / _TARGET_FAMILY.
  #
  # `cfg!(feature = ...)` is fine and stays allowed: features ARE passed through.
  build-scripts-read-the-target:
    name: build scripts read the target, not the host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no host platform predicates in build.rs
        run: |
          # strip comment lines first — the fixed scripts explain the trap in prose
          if grep -rnE '^[^/]*cfg!\((unix|windows|target_os|target_family|target_arch)' \
               --include='build.rs' . ; then
            echo "::error::A build script is reading a HOST cfg. Build scripts run on the"
            echo "host, so this describes the build machine, not the target — it silently"
            echo "mis-configures every cross-compile. Use CARGO_CFG_TARGET_OS /"
            echo "CARGO_CFG_TARGET_FAMILY instead. cfg!(feature = ...) is fine."
            exit 1
          fi
          echo "OK: build scripts derive platform from the target."

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
