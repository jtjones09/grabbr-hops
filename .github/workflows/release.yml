# Build pre-built hops binaries, sign the macOS app, and publish a GitHub Release.
#
# Trigger: push a version tag (e.g. `git tag v0.11.0 && git push origin v0.11.0`),
# or run it by hand from the Actions tab ("Run workflow"). Both run every job
# except publish: a run by hand from any branch builds all three platforms and
# produces the signed, notarized dmg as the `hops-macos-universal-dmg` artifact,
# and publishes nothing. Only a pushed `v*` tag publishes.
#
# Produces, per release:
#   - hops-macos-universal.dmg       (Intel + Apple Silicon GUI app, signed and
#                                     notarized; see docs/SIGNING.md)
#   - hops-macos-universal.tar.gz    (the bare universal CLI binary; unsigned)
#   - hops-windows-x86_64.zip        (GUI build)
#   - hops-linux-x86_64.tar.gz       (daemon + terminal UI; the Slint GUI on Linux
#                                     needs desktop libs, so the Linux artifact is
#                                     TUI-only for a reliable, dependency-light build)
#   - hops-<target>.cdx.json         (a CycloneDX SBOM for each target compiled)
#   - SHA256SUMS                     (the SHA-256 of every other asset)
#
# Every binary is built with `cargo auditable`, which embeds the list of crates
# it was built from. Each archive, and the app in the dmg, holds LICENSE,
# THIRD-PARTY-NOTICES.txt and the SBOM of each target its binary is compiled
# for. The attest job signs a build-provenance attestation for every asset.
# Check one pinned to this workflow and the release's tag; without the two
# flags, an attestation from any run in the repository, on any branch, passes:
#   gh attestation verify <asset> --repo <owner>/<repo> \
#     --signer-workflow <owner>/<repo>/.github/workflows/release.yml \
#     --source-ref refs/tags/v<version>
#
# Signing runs in its own job, sign-macos, which runs no cargo and receives only
# the unsigned universal build. The build job compiles every dependency's build
# script and proc macro, so nothing secret may be visible there. The signing
# secrets live in the `macos-signing` environment and are read only by
# sign-macos, which fails when any of them is missing: a run that cannot sign
# is a failed run, never a release without its dmg.
#
# Every action is pinned to a commit, with the tag it stands for in a comment.
# A tag can be moved to other code after review; a commit cannot. That includes
# dtolnay/rust-toolchain, whose version refs are branches: the compiler is its
# `toolchain` input, which `toolchain_pin` in src/lib.rs checks against
# rust-toolchain.toml.
# Windows signing is still a TODO (see the marker below).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Read-only for every job. Only publish asks for more, for itself.
permissions:
  contents: read

jobs:
  # A tag is a claim about which build this is, and nothing checked it. The crate
  # version and the tag are two statements of the same fact written in different
  # files, and the artifact carries the crate's — so a v0.14.0 tag on a 0.12.0
  # crate ships a bundle that identifies itself as 0.12.0, with no failure
  # anywhere. Joining the two costs one job.
  #
  # The job runs on every event, because a job that is skipped skips every job
  # that needs it: gated on the tag, it left a run by hand with nothing built.
  version-matches-tag:
    name: the artifact says which build it is
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: a tag must equal the crate version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::notice::$GITHUB_REF is not a version tag. This run publishes nothing, so there is no version claim to check."
              exit 0
              ;;
          esac
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate."
            echo "The published artifact would report $crate. Bump the crate or"
            echo "retag; do not release a build that misreports its own version."
            exit 1
          fi
          echo "OK: the artifact will report $crate."

  # No release is built while a published advisory stands against a crate in
  # Cargo.lock.
  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          command: check advisories
          arguments: --all-features --workspace

      # The cargo-deny the gate above runs, for the report the notes are
      # written from.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # The release names every advisory the gate above lets through, and
      # why. That is not only deny.toml's ignore list: its unmaintained and
      # unsound scopes let advisories through too, without naming them. So
      # the list is what cargo-deny reports with every exception removed,
      # each given deny.toml's reason for ignoring it or the scope that left
      # it out. An ignore this step cannot read, one with a blank reason, or
      # an advisory neither explains fails the run.
      - name: the release notes name every advisory the gate lets through
        run: |
          entry='^\{ *id *= *"([A-Z]+-[0-9]+-[0-9]+)" *, *reason *= *"( *[^" ][^"]*)" *\},?$'
          scope_line='^(unmaintained|unsound)[[:space:]]*=[[:space:]]*"([a-z]+)"[[:space:]]*(#.*)?$'
          # cargo-deny 0.20.2's scopes when deny.toml sets none.
          unmaintained=all
          unsound=workspace
          tmp="${RUNNER_TEMP:?}"
          ignored="$tmp/deny-ignored.tsv"
          widened="$tmp/deny-widened.toml"
          report="$tmp/deny-report.jsonl"
          found="$tmp/deny-found.tsv"
          : > "$ignored"
          : > "$widened"
          section=""; state=out; seen=no; bad=0
          while IFS= read -r line || [ -n "$line" ]; do
            t="${line#"${line%%[![:space:]]*}"}"
            t="${t%"${t##*[![:space:]]}"}"
            if [ "$state" = list ]; then
              case "$t" in
                ""|"#"*) continue ;;
                "]"*) state=out; continue ;;
              esac
              if [[ "$t" =~ $entry ]]; then
                printf '%s\t%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >> "$ignored"
              else
                echo "::error::deny.toml ignores an advisory with no reason, or in a form this step cannot read: $t"
                bad=1
              fi
              continue
            fi
            if [[ "$t" =~ ^\[\[?([^]]*)\]\]?$ ]]; then
              section="${BASH_REMATCH[1]}"
              printf '%s\n' "$line" >> "$widened"
              if [ "$section" = advisories ]; then
                seen=yes
                printf 'unmaintained = "all"\nunsound = "all"\n' >> "$widened"
              fi
              continue
            fi
            if [[ "$t" =~ ^advisories[[:space:]]*[.=] ]]; then
              echo "::error::deny.toml sets advisories outside its [advisories] table: $t"
              bad=1
            elif [ "$section" = advisories ]; then
              if [[ "$t" =~ ^ignore[[:space:]]*=[[:space:]]*\[(.*)$ ]]; then
                rest="${BASH_REMATCH[1]}"
                if [[ "$rest" =~ ^[[:space:]]*(#.*)?$ ]]; then
                  state=list
                elif [[ ! "$rest" =~ ^[[:space:]]*\][[:space:]]*(#.*)?$ ]]; then
                  echo "::error::deny.toml lists ignored advisories on one line: $t. Write each as { id = \"...\", reason = \"...\" } on its own line."
                  bad=1
                fi
                continue
              fi
              if [[ "$t" =~ $scope_line ]]; then
                printf -v "${BASH_REMATCH[1]}" '%s' "${BASH_REMATCH[2]}"
                continue
              fi
            fi
            printf '%s\n' "$line" >> "$widened"
          done < deny.toml
          if [ "$state" = list ]; then
            echo "::error::the ignore list in deny.toml is never closed."
            bad=1
          fi
          if [ "$seen" = no ]; then
            printf '[advisories]\nunmaintained = "all"\nunsound = "all"\n' >> "$widened"
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          # The gate with no ignores and every scope widened to all. The
          # gate passed, so each advisory this reports is one it let through.
          status=0
          cargo deny --locked --format json --config "$widened" --all-features --workspace \
            check advisories 2> "$report" || status=$?
          summaries="$(jq -nR '[inputs | fromjson? | select(type == "object" and .type == "summary")] | length' "$report")"
          if [ "$status" -gt 1 ] || [ "$summaries" != 1 ]; then
            cat "$report"
            echo "::error::cargo-deny did not finish its report (exit $status), so the notes cannot say which advisories the gate lets through."
            exit 1
          fi
          jq -rnR '[inputs | fromjson? | select(type == "object" and .type == "diagnostic")
              | .fields | select(.advisory.id? != null)
              | [.advisory.id, .code, .advisory.package, .graphs[0].Krate.version?, .advisory.title]
              | map(if . == null or . == "" then "?" else tostring | gsub("[\t\n\r]"; " ") end)
              | join("\t")] | unique[]' "$report" > "$found"

          count=0; list=""
          while IFS=$'\t' read -r id kind krate version title; do
            if [[ ! "$id" =~ ^[A-Z]+-[0-9]+-[0-9]+$ ]]; then
              echo "::error::cargo-deny reports an advisory id this step cannot read: $id"
              bad=1
              continue
            fi
            why="$(awk -F'\t' -v id="$id" '$1 == id { print $2; exit }' "$ignored")"
            if [ -z "$why" ]; then
              case "$kind" in
                unmaintained|unsound) scope="${!kind}" ;;
                *) scope=all ;;
              esac
              case "$scope" in
                workspace) why="$kind, and no hops crate depends on it directly; deny.toml fails on $kind crates only when one does (\`$kind = \"workspace\"\`)" ;;
                transitive) why="$kind, and only hops crates depend on it directly; deny.toml fails on $kind crates only when another crate does (\`$kind = \"transitive\"\`)" ;;
                none) why="$kind, and deny.toml does not check $kind crates (\`$kind = \"none\"\`)" ;;
                *)
                  echo "::error::cargo-deny reports $id against $krate $version, which deny.toml neither ignores nor leaves out of its $kind scope; the gate should have failed this run."
                  bad=1
                  continue
                  ;;
              esac
            fi
            list+="- [$id](https://rustsec.org/advisories/$id.html) \`$krate\` $version: $title. Not acted on: $why"$'\n'
            count=$((count + 1))
          done < "$found"
          while IFS=$'\t' read -r id _; do
            if ! cut -f1 "$found" | grep -qxF -- "$id"; then
              echo "::warning::deny.toml ignores $id, which cargo-deny no longer reports against Cargo.lock; the ignore can go."
            fi
          done < "$ignored"
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          signer="${GITHUB_WORKFLOW_REF:?}"
          signer="${signer%%@*}"
          {
            echo "## Verifying a download"
            echo
            echo "\`SHA256SUMS\` holds the SHA-256 of every other asset, and every asset has a build-provenance attestation. Check the attestation against this release's workflow and tag: without \`--signer-workflow\` and \`--source-ref\`, one from any workflow run in the repository, on any branch, passes."
            echo
            echo "    shasum -a 256 -c --ignore-missing SHA256SUMS"
            echo "    gh attestation verify <asset> --repo ${GITHUB_REPOSITORY:?} --signer-workflow $signer --source-ref ${GITHUB_REF:?}"
            echo
            echo "Each archive, and the app in the dmg, holds \`LICENSE\`, \`THIRD-PARTY-NOTICES.txt\` and a CycloneDX SBOM for each target its binary is built for. Each binary also embeds the list of crates it was built from, which \`cargo audit bin <binary>\` reads."
            echo
            echo "## Advisories this release does not act on"
            echo
            if [ "$count" -eq 0 ]; then
              echo "None: cargo-deny reports no advisory against a crate in \`Cargo.lock\`."
            else
              echo "Every release build is gated on \`cargo deny check advisories\`, which lets these through: each advisory \`deny.toml\` ignores, for the reason given there, and each outside the scope it checks unmaintained and unsound crates in. The list is what cargo-deny reports for \`Cargo.lock\` with those exceptions removed."
              echo
              printf '%s' "$list"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # No secret reaches this job: it compiles third-party build scripts and proc
  # macros, and any of them can read the environment it runs in.
  build:
    needs: [version-matches-tag, advisories]
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # `targets` is every target the binary is compiled for. The SBOMs and
        # notices are generated for exactly these, and the builds compile
        # exactly these, so the two cannot describe different binaries.
        include:
          - { os: macos-latest,   name: macos-universal,  targets: "aarch64-apple-darwin x86_64-apple-darwin", features: "tui slint" }
          - { os: windows-latest, name: windows-x86_64,    targets: "x86_64-pc-windows-msvc", features: "tui slint" }
          # The Linux backends are FEATURE-gated while macOS/Windows backends are
          # PLATFORM-gated (`#[cfg(windows)]`, `#[cfg(target_os = "macos")]`), so
          # the same `--no-default-features` line produced a working binary on two
          # platforms and an inert one on the third. Built with "tui" alone this
          # shipped a KVM containing only the `dummy` backend — it accepted input
          # and discarded it, from 2026-07-06 through v0.12.0 (#47).
          - { os: ubuntu-latest,  name: linux-x86_64,      targets: "x86_64-unknown-linux-gnu", features: "tui libei_capture libei_emulation layer_shell_capture wlroots_emulation x11_capture x11_emulation rdp_emulation" }
    runs-on: ${{ matrix.os }}
    env:
      FEATURES: ${{ matrix.features }}
      TARGETS: ${{ matrix.targets }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # so build.rs can read the git commit
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03, base of branch 1.98.0
        with:
          toolchain: 1.98.0

      # Exact versions, each built from its own lockfile.
      - name: Install the release tools
        shell: bash
        run: |
          cargo install --locked cargo-auditable@0.7.6
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo install --locked --features cli cargo-about@0.9.2

      # --- build ---
      # `cargo auditable build` embeds the list of crates each binary was
      # built from, which `cargo audit bin` and other scanners read.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          bins=()
          for t in $TARGETS; do
            rustup target add "$t"
            cargo auditable build --locked --release --no-default-features --features "$FEATURES" --target "$t"
            bins+=("target/$t/release/hops")
          done
          mkdir -p dist
          # The bare universal CLI binary, unsigned. It is also the binary
          # sign-macos receives, so the dmg holds exactly this binary.
          lipo -create -output dist/hops "${bins[@]}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo auditable build --locked --release --no-default-features --features "$env:FEATURES" --target "$env:TARGETS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\$env:TARGETS\release\hops.exe" dist\hops.exe
          # TODO(signing): signtool sign /fd SHA256 /tr <timestamp-url> /td SHA256 /a dist\hops.exe

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxtst-dev pkg-config

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo auditable build --locked --release --no-default-features --features "$FEATURES" --target "$TARGETS"
          bin="target/$TARGETS/release/hops"

          # A Linux build with no input backends compiles, links, runs, connects,
          # and silently discards every event. It shipped for months (#47). Assert
          # the real backends are actually IN the artifact — a green build is not
          # evidence that the KVM can move a cursor.
          missing=0
          for f in input-capture/src/libei.rs \
                   input-emulation/src/libei.rs \
                   input-capture/src/layer_shell.rs \
                   input-emulation/src/wlroots.rs ; do
            if ! strings "$bin" | grep -q "$f" ; then
              echo "::error::$f is NOT in the binary — this build would fall back to the dummy backend and discard all input."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish a Linux artifact with no usable input backend."
            exit 1
          fi
          echo "OK: real capture and emulation backends are present in the binary."

          mkdir -p dist
          cp "$bin" dist/hops

      # What every archive carries beside the binary: the licence, the
      # third-party notices, and a CycloneDX SBOM per target, all for this
      # build's features and targets. cargo-about fails on a licence that
      # build-aux/about.toml does not accept. After the fetch nothing here
      # reaches the network: cargo-cyclonedx has no --locked, so it runs
      # offline, and the step fails if Cargo.lock changed under it, since
      # the SBOMs would then describe another resolution than the build.
      - name: Licence notices and SBOMs
        shell: bash
        run: |
          cargo fetch --locked
          export CARGO_NET_OFFLINE=true
          lock="$(mktemp)"
          cp Cargo.lock "$lock"
          mkdir -p dist
          cp LICENSE dist/LICENSE
          selected=()
          for t in $TARGETS; do selected+=(--target "$t"); done
          cargo about generate --frozen --fail -c build-aux/about.toml \
            --no-default-features --features "$FEATURES" "${selected[@]}" \
            -o dist/THIRD-PARTY-NOTICES.txt build-aux/third-party-notices.hbs
          for t in $TARGETS; do
            cargo cyclonedx --format json --spec-version 1.5 \
              --no-default-features --features "$FEATURES" --target "$t" \
              --override-filename "hops-$t.cdx"
            cp "hops-$t.cdx.json" "dist/hops-$t.cdx.json"
          done
          if ! cmp -s Cargo.lock "$lock"; then
            echo "::error::generating the notices and SBOMs changed Cargo.lock, so they may not describe the binary that was built."
            exit 1
          fi

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          files=(dist/*)
          tar -C dist -czf "hops-$NAME.tar.gz" "${files[@]#dist/}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\* -DestinationPath "hops-$env:NAME.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hops-${{ matrix.name }}
          path: |
            hops-${{ matrix.name }}.*
            hops-*.cdx.json
          if-no-files-found: error

  # The only job that sees a signing secret. It runs no cargo, its scripts
  # come from its own checkout, and it receives only the unsigned build to
  # bundle, sign and submit: the binary, its licence, notices and SBOMs. No
  # step is conditional, so every run signs or fails.
  sign-macos:
    name: sign-macos
    needs: build
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Each value is whether the secret is set, never the secret itself.
      - name: every signing secret is set
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 != '' }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD != '' }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID != '' }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID != '' }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER != '' }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_DEVELOPER_ID \
                      MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER; do
            if [ "${!name}" != true ]; then
              echo "::error::the $name secret is not set in the macos-signing environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Without every signing secret there is no signed dmg, and a release"
            echo "without its dmg is not published. See docs/SIGNING.md."
            exit 1
          fi
          echo "OK: every signing secret is set."

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hops-macos-universal
          path: ${{ runner.temp }}/unsigned

      # The archive comes from the job that runs third-party build scripts,
      # so it must hold exactly the binary, its licence, notices and SBOMs,
      # and only those are extracted: beside the binary, where
      # package-macos.sh takes all but the binary into the app.
      - name: Unpack the unsigned build
        run: |
          BIN="$RUNNER_TEMP/bin"
          ARCHIVE="$RUNNER_TEMP/unsigned/hops-macos-universal.tar.gz"
          members="hops LICENSE THIRD-PARTY-NOTICES.txt hops-aarch64-apple-darwin.cdx.json hops-x86_64-apple-darwin.cdx.json"
          listed="$(tar -tzf "$ARCHIVE")" || {
            echo "::error::cannot read the unsigned artifact."
            exit 1
          }
          bad=0
          for f in $members; do
            n="$(printf '%s\n' "$listed" | grep -cxF -- "$f" || true)"
            if [ "$n" = 0 ]; then
              echo "::error::the unsigned artifact carries no $f, so the app would ship without it."
              bad=1
            elif [ "$n" != 1 ]; then
              echo "::error::the unsigned artifact carries $f $n times."
              bad=1
            fi
          done
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            known=no
            for f in $members; do
              if [ "$m" = "$f" ]; then known=yes; fi
            done
            if [ "$known" = no ]; then
              echo "::error::the unsigned artifact carries $m, which is not part of the build."
              bad=1
            fi
          done <<< "$listed"
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          mkdir -p "$BIN"
          # shellcheck disable=SC2086 # one word per member
          tar -xzf "$ARCHIVE" -C "$BIN" $members
          for f in $members; do
            if [ ! -f "$BIN/$f" ] || [ -L "$BIN/$f" ] || [ ! -s "$BIN/$f" ]; then
              echo "::error::the unsigned artifact's $f is not a plain file with content."
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Package, sign and notarize the dmg
        env:
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          BIN="$RUNNER_TEMP/bin"
          scripts/package-macos.sh "$BIN/hops" "$RUNNER_TEMP/dist"
          KEYFILE="$RUNNER_TEMP/notary_key.p8"
          (umask 077 && printf '%s' "$MACOS_NOTARY_KEY_B64" | base64 --decode > "$KEYFILE")
          NOTARY_KEY="$KEYFILE" scripts/sign-macos.sh "$RUNNER_TEMP/dist"
          rm -f "$KEYFILE"
          cp "$RUNNER_TEMP/dist/hops-macos.dmg" hops-macos-universal.dmg

      - name: Gatekeeper accepts the dmg and the app inside it
        run: |
          scripts/verify-macos-release.sh hops-macos-universal.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hops-macos-universal-dmg
          path: hops-macos-universal.dmg
          if-no-files-found: error

  # Checksums for every asset, and a signed statement of which workflow run
  # built each one. It runs on a dispatch too, so a dry run proves the
  # attestation verifies before a tag depends on it. It may mint an OIDC token
  # and write attestations, and nothing else; it checks out no code.
  attest:
    name: checksums and provenance
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: hops-*
          merge-multiple: true

      # The dmg is checked on macOS by scripts/verify-macos-release.sh before
      # sign-macos uploads it; the archives are checked here.
      - name: every archive carries its licence, notices, SBOMs and audit data
        working-directory: artifacts
        run: |
          status=0
          fail() {
            echo "::error::$*"
            status=1
          }
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          check() { # <archive> <binary> <target>...
            local archive="$1" bin="$2" dir="$unpacked/$1" t f
            shift 2
            if [ ! -s "$archive" ]; then
              fail "$archive is missing or empty."
              return
            fi
            local want=("$bin" LICENSE THIRD-PARTY-NOTICES.txt) listed m known
            for t; do want+=("hops-$t.cdx.json"); done
            # What is published is exactly what the build meant to ship.
            case "$archive" in
              *.zip) listed="$(unzip -Z1 "$archive")" || { fail "cannot read $archive."; return; } ;;
              *) listed="$(tar -tzf "$archive")" || { fail "cannot read $archive."; return; } ;;
            esac
            while IFS= read -r m; do
              [ -n "$m" ] || continue
              known=no
              for f in "${want[@]}"; do
                if [ "$m" = "$f" ]; then known=yes; fi
              done
              if [ "$known" = no ]; then
                fail "$archive carries $m, which is not part of the build."
              fi
            done <<< "$listed"
            mkdir -p "$dir"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$dir" || { fail "cannot unpack $archive."; return; } ;;
              *) tar -xzf "$archive" -C "$dir" || { fail "cannot unpack $archive."; return; } ;;
            esac
            for f in "${want[@]}"; do
              if [ ! -f "$dir/$f" ] || [ -L "$dir/$f" ]; then
                fail "$archive carries no $f."
              elif [ ! -s "$dir/$f" ]; then
                fail "$archive carries an empty $f."
              fi
            done
            # The section cargo auditable embeds the dependency list in.
            if [ -f "$dir/$bin" ] && ! grep -qaF .dep-v0 "$dir/$bin"; then
              fail "the $bin in $archive embeds no dependency list; it was not built with cargo auditable."
            fi
            for t; do
              f="hops-$t.cdx.json"
              if [ -f "$dir/$f" ] && ! grep -qE '"bomFormat": *"CycloneDX"' "$dir/$f"; then
                fail "$f in $archive is not a CycloneDX SBOM."
              fi
            done
          }
          check hops-linux-x86_64.tar.gz hops x86_64-unknown-linux-gnu
          check hops-macos-universal.tar.gz hops aarch64-apple-darwin x86_64-apple-darwin
          check hops-windows-x86_64.zip hops.exe x86_64-pc-windows-msvc
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "OK: every archive carries its licence, notices, SBOMs and an auditable binary."

      # Written outside the directory it describes, so it names every other
      # asset and not itself.
      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: artifacts/
          if-no-files-found: error

  # The only job that may write, and it runs no code from the repository. It
  # publishes the attested set and nothing else.
  publish:
    name: publish-release
    needs: [version-matches-tag, advisories, build, sign-macos, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: artifacts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: the release is exactly its assets, each as SHA256SUMS describes it
        working-directory: artifacts
        run: |
          expected="SHA256SUMS
          hops-aarch64-apple-darwin.cdx.json
          hops-linux-x86_64.tar.gz
          hops-macos-universal.dmg
          hops-macos-universal.tar.gz
          hops-windows-x86_64.zip
          hops-x86_64-apple-darwin.cdx.json
          hops-x86_64-pc-windows-msvc.cdx.json
          hops-x86_64-unknown-linux-gnu.cdx.json"
          status=0
          for f in $expected; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty. A release is published with every asset or not at all."
              status=1
            elif [ "$f" != SHA256SUMS ] && [ -s SHA256SUMS ] &&
                 ! sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | grep -qxF -- "$f"; then
              echo "::error::SHA256SUMS does not name $f."
              status=1
            fi
          done
          for f in * .[!.]*; do
            [ -e "$f" ] || continue
            if ! printf '%s\n' $expected | grep -qxF -- "$f"; then
              echo "::error::$f is not a release asset; nothing unlisted is published."
              status=1
            fi
          done
          if [ -s SHA256SUMS ] && ! sha256sum -c SHA256SUMS; then
            echo "::error::an asset no longer matches SHA256SUMS, so it is not the file that was attested."
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "OK: every release asset is present and matches SHA256SUMS, and nothing else is."

      # The release action publishes an empty body, with only a warning, when
      # body_path cannot be read.
      - name: the release notes are present
        run: |
          if [ ! -s notes/release-notes.md ]; then
            echo "::error::notes/release-notes.md is missing or empty; the release would not say which advisories it ignores."
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: notes/release-notes.md
          generate_release_notes: true
